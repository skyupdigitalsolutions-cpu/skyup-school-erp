# Nginx reverse proxy for the School ERP API (place in /etc/nginx/sites-available).
# Wildcard server_name supports per-school sub-domains for tenant resolution.

upstream school_erp_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.example.com *.api.example.com;

    # Redirect all HTTP to HTTPS (enable after certificates are installed).
    # return 301 https://$host$request_uri;

    client_max_body_size 10m;

    location / {
        proxy_pass         http://school_erp_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }
}

